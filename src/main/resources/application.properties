# Servidor
server.port=${PORT:8081}
server.servlet.context-path=/

# Conexión a Base de Datos Microsoft SQL Server
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=CapacitacionDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:TuPassword}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect

# Configuración de subida de archivos (Comprobantes / Vouchers)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/comprobantes

# Configuración JWT para Autenticación de Administrador
app.jwt.secret=${JWT_SECRET:CAMBIA_ESTE_VALOR_EN_TU_MAQUINA_LOCAL}
app.jwt.expiration-ms=86400000

# Credenciales de Administrador (personalizables mediante Variables de Entorno en Render)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Administrador Principal}
app.admin.email=${ADMIN_EMAIL:admin@capacitacion.pe}

# Archivos estáticos
spring.web.resources.static-locations=classpath:/static/,file:uploads/

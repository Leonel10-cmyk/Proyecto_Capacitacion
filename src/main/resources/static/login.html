<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - Capacitación EBDN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Card Login Alegre -->
    <div class="glass-panel w-full max-w-md rounded-3xl p-8 sm:p-10 animate-fade-in relative shadow-xl border border-white">
        
        <div class="relative z-10">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-purple-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md shadow-indigo-500/20 text-2xl">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 font-heading">Panel Administrativo</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Inicia sesión para gestionar la Hoja de Datos y Pagos EBDN</p>
            </div>

            <!-- Alerta -->
            <div id="alertBox" class="hidden mb-5 p-3.5 rounded-2xl text-xs font-bold"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-user text-indigo-500"></i> Usuario
                    </label>
                    <input type="text" id="username" required placeholder="Nombre de usuario" value="admin"
                        class="glass-input w-full rounded-2xl px-4 py-2.5 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-400">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-key text-indigo-500"></i> Contraseña
                    </label>
                    <input type="password" id="password" required placeholder="••••••••" value="admin123"
                        class="glass-input w-full rounded-2xl px-4 py-2.5 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-400">
                </div>

                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-800 flex items-center gap-2">
                    <i class="fa-solid fa-lightbulb text-amber-500 text-sm"></i>
                    <span>Acceso por defecto: <b>admin</b> / <b>admin123</b></span>
                </div>

                <button type="submit" id="btnLogin"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-md shadow-indigo-600/20 transition-all flex items-center justify-center gap-2 text-sm active:scale-95">
                    <span id="btnText">Ingresar al Sistema</span>
                    <span id="btnLoader" class="loader hidden ml-2 border-t-white"></span>
                </button>
            </form>

            <div class="mt-8 text-center pt-5 border-t border-slate-100">
                <a href="index.html" class="text-xs text-slate-500 hover:text-indigo-600 font-bold transition-colors flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Volver al Formulario de Inscripción</span>
                </a>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
